name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: fronius_auth_proxy/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: fronius_auth_proxy

      - name: Run tests
        run: npm test
        working-directory: fronius_auth_proxy
